<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>MNIST Canvas Component</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: transparent;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 10px;
      user-select: none;
      -webkit-user-select: none;
    }
    .canvas-container {
      position: relative;
      background: #ffffff;
      border: 3px solid #3b82f6;
      border-radius: 12px;
      box-shadow: 0 4px 16px rgba(59, 130, 246, 0.2);
      overflow: hidden;
      touch-action: none;
    }
    canvas {
      display: block;
      background: #ffffff;
      cursor: crosshair;
    }
    .controls {
      display: flex;
      gap: 12px;
      margin-top: 14px;
      width: 280px;
      justify-content: space-between;
    }
    button {
      flex: 1;
      padding: 10px 16px;
      font-size: 14px;
      font-weight: 600;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.15s ease-in-out;
    }
    .btn-predict {
      background: #2563eb;
      color: #ffffff;
    }
    .btn-predict:hover {
      background: #1d4ed8;
      transform: translateY(-1px);
    }
    .btn-clear {
      background: #f1f5f9;
      color: #475569;
      border: 1px solid #cbd5e1;
    }
    .btn-clear:hover {
      background: #e2e8f0;
      color: #1e293b;
      transform: translateY(-1px);
    }
    .hint {
      margin-top: 10px;
      font-size: 12px;
      color: #64748b;
      text-align: center;
      min-height: 16px;
    }
  </style>
</head>
<body>

  <div class="canvas-container">
    <canvas id="paintCanvas" width="280" height="280"></canvas>
  </div>

  <div class="controls">
    <button class="btn-clear" id="btnClear" onclick="clearCanvas()">
      🧹 Clear
    </button>
    <button class="btn-predict" id="btnPredict" onclick="submitDrawing()">
      🔮 Predict
    </button>
  </div>

  <div class="hint" id="statusHint">
    Draw a digit in the center with a thick stroke
  </div>

  <script>
    const canvas = document.getElementById('paintCanvas');
    const ctx = canvas.getContext('2d');
    const hint = document.getElementById('statusHint');

    // Drawing configuration
    ctx.lineWidth = 22;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.strokeStyle = '#000000';
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    let isDrawing = false;
    let hasInk = false;
    let lastX = 0;
    let lastY = 0;

    function getCoords(e) {
      const rect = canvas.getBoundingClientRect();
      const scaleX = canvas.width / rect.width;
      const scaleY = canvas.height / rect.height;
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;
      return [
        (clientX - rect.left) * scaleX,
        (clientY - rect.top) * scaleY
      ];
    }

    function startDraw(e) {
      e.preventDefault();
      isDrawing = true;
      hasInk = true;
      [lastX, lastY] = getCoords(e);
      // Draw initial dot
      ctx.beginPath();
      ctx.arc(lastX, lastY, ctx.lineWidth / 2, 0, Math.PI * 2);
      ctx.fillStyle = '#000000';
      ctx.fill();
      hint.textContent = 'Drawing... Click Predict when done';
      hint.style.color = '#2563eb';
    }

    function draw(e) {
      if (!isDrawing) return;
      e.preventDefault();
      const [x, y] = getCoords(e);
      ctx.beginPath();
      ctx.moveTo(lastX, lastY);
      ctx.lineTo(x, y);
      ctx.stroke();
      [lastX, lastY] = [x, y];
    }

    function stopDraw(e) {
      if (!isDrawing) return;
      isDrawing = false;
      // Auto-update after mouse release
      submitDrawing(false);
    }

    // Event listeners
    canvas.addEventListener('mousedown', startDraw);
    canvas.addEventListener('mousemove', draw);
    window.addEventListener('mouseup', stopDraw);

    canvas.addEventListener('touchstart', startDraw, { passive: false });
    canvas.addEventListener('touchmove', draw, { passive: false });
    window.addEventListener('touchend', stopDraw);

    function isCanvasBlank() {
      if (!hasInk) return true;
      const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height).data;
      for (let i = 0; i < imgData.length; i += 4) {
        if (imgData[i] < 240 || imgData[i+1] < 240 || imgData[i+2] < 240) {
          return false;
        }
      }
      return true;
    }

    function clearCanvas() {
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      hasInk = false;
      hint.textContent = 'Canvas cleared. Draw a new digit';
      hint.style.color = '#64748b';
      sendToStreamlit('');
    }

    function submitDrawing(manual = true) {
      if (isCanvasBlank()) {
        if (manual) {
          hint.textContent = '⚠️ Canvas is empty. Draw a digit first';
          hint.style.color = '#ef4444';
        }
        return;
      }
      const dataUrl = canvas.toDataURL('image/png');
      sendToStreamlit(dataUrl);
      hint.textContent = '✅ Drawing captured! Analyzing...';
      hint.style.color = '#16a34a';
    }

    // Streamlit Component Protocol
    function sendToStreamlit(value) {
      window.parent.postMessage({
        isStreamlitMessage: true,
        type: 'streamlit:setComponentValue',
        value: value
      }, '*');
    }

    function notifyReady() {
      window.parent.postMessage({
        isStreamlitMessage: true,
        type: 'streamlit:componentReady',
        apiVersion: 1
      }, '*');
      updateHeight();
    }

    function updateHeight() {
      const h = Math.ceil(document.body.scrollHeight || 380);
      window.parent.postMessage({
        isStreamlitMessage: true,
        type: 'streamlit:setFrameHeight',
        height: Math.max(h, 380)
      }, '*');
    }

    window.addEventListener('message', function(e) {
      if (e.data && e.data.type === 'streamlit:render') {
        updateHeight();
      }
    });

    window.addEventListener('load', notifyReady);
    setTimeout(notifyReady, 100);
  </script>
</body>
</html>
