services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: doc_understanding_api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - HOST=0.0.0.0
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - doc_net

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: doc_understanding_frontend
    restart: unless-stopped
    command: ["streamlit", "run", "frontend/app.py", "--server.port=8501", "--server.address=0.0.0.0"]
    ports:
      - "8501:8501"
    environment:
      - API_URL=http://api:8000
    depends_on:
      api:
        condition: service_healthy
    networks:
      - doc_net

networks:
  doc_net:
    driver: bridge
